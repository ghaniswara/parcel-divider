[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pee"
version = "0.1.0"
description = "Parcel Equalization Engine — topology-preserving parcel area optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "shapely>=2.0",
    "scipy>=1.11",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pee*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
